name: Собрать APK

on:
  push:
    branches: [main, wtogether]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm install

      - name: Создать Android-проект
        run: npx cap add android

      - name: Разрешить синхронный запуск видео без нажатия
        run: |
          cat > android/app/src/main/java/com/wtogether/app/MainActivity.java <<'JAVA'
          package com.wtogether.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              }
          }
          JAVA

      - name: Скопировать приложение и плагины
        run: npx cap sync android

      - name: Собрать APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Wtogether.apk

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: Wtogether-apk
          path: Wtogether.apk

      - name: Выложить APK в Releases (удобно скачать с телефона)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wtogether-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Wtogether, сборка ${{ github.run_number }}
          files: Wtogether.apk
