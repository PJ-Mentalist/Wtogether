<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/>
      <stop offset="1" stop-color="#2A6FE8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B2E6B" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- скруглённый квадрат в стиле иконок exteraGram -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bg)" filter="url(#sh)"/>
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#gloss)"/>
  <!-- экран -->
  <rect x="118" y="100" width="276" height="184" rx="38" fill="#FFFFFF"/>
  <path d="M232 152 L232 232 L298 192 Z" fill="#2F7BF0" stroke="#2F7BF0" stroke-width="10" stroke-linejoin="round"/>
  <!-- две головы под экраном -->
  <g fill="#FFFFFF">
    <circle cx="210" cy="346" r="30"/>
    <path d="M154 420 a56 50 0 0 1 112 0 a12 12 0 0 1 -12 12 h-88 a12 12 0 0 1 -12 -12 z"/>
  </g>
  <g fill="#FFFFFF" stroke="#3A84EE" stroke-width="10" paint-order="stroke">
    <circle cx="302" cy="346" r="30"/>
    <path d="M246 420 a56 50 0 0 1 112 0 a12 12 0 0 1 -12 12 h-88 a12 12 0 0 1 -12 -12 z"/>
  </g>
</svg>
